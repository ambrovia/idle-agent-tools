# Weekly self-improve routine for Codex — distills recurring taste, assumption, retro, and outcome patterns across projects.
[automation]
name = "Weekly Self-Improve"
schedule = "0 9 * * 1"

[prompt]
content = """
Run the /self-improve weekly routine across all projects with new completed work, retros, outcomes, or decisions since the last /self-improve pass (or for this repository when running standalone). Record 1-occurrence candidates in project memory, and for any confirmed pattern (2+ independent occurrences for general taste/domain conventions, 3+ for process/skill changes), drop a proposed root task or report the evidence-backed proposal for human approval. Never edit rules or skills unattended.
"""
