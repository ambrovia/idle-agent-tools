# pipeline.config.yml — the ONLY repo-specific file the skills need.
# Copy this to pipeline.config.yml and edit. Skills read these values instead of
# hardcoding anything (they reference them as {{verify}}, {{vcs}}, ...).

# The single command that must pass before a work package can ship.
# Tests for a library, `terraform plan` + policy for infra, E2E for an app —
# what "green" means is up to you, as long as one command produces it.
verify: "npm run verify"

# The customer every planning + critique phase is building for (over- and
# under-building both count as defects). /refine re-confirms it
# and stops for a maintainer decision if unclear. Overridable per-track and
# per-work-package.
#   prototype  — builders/internal demo: core flow works manually; key features may be absent
#   mvp        — early tolerant users: core works mostly; auxiliary features and edge cases may be absent
#   production — ordinary users/customers: works normally and reliably; standard tests, errors, and security
#   critical   — enterprise/regulated/high-consequence customers: compliance, audit, rollback, and operational controls
engineering:
  tier: mvp

# Where the code lives. Used to scope reviews.
paths:
  source: ["src/**"]
  tests: ["**/*.test.*"]
  docs: ["docs/**"]

# Path + conventions of your design system. null → the design
# phases are skipped (backend / infra / library repos).
designSystem: null
# designSystem:
#   path: "src/design-system"
#   tokens: "src/design-system/tokens.css"

# Version control + where "ship" opens PRs and waits for CI. github | gitlab | none
vcs: github

# Optional worktree lifecycle commands and contamination checks. Configure only
# commands the repository owns; the pipeline never guesses cleanup behavior.
# worktree:
#   bootstrap: "npm ci"
#   cleanup: null
#   forbiddenArtifacts: ["core", "**/*.tsbuildinfo"]

# Mechanical checks run once before a reviewer or builder-retry spawn; the
# results are injected into the spawn brief so agents judge them instead of
# re-running them. Defaults to `verify` when absent — point it at a faster
# subset (lint + typecheck) when the full gate is too slow per spawn.
#
# TRUST: where the skill-load hook is wired, this command is run by the hook
# itself whenever /review, /write-code, or /write-tests loads — a hook runs
# directly, so it is not covered by the host's tool-permission prompts. Point
# it only at commands this repository owns, and treat an edit to this line the
# way you would treat an edit to a CI workflow. Set PIPELINE_SKILL_INJECT=off
# to disable injection entirely.
# checks:
#   preSpawn: "npm run lint && npm run typecheck"

# Long-running checks wired into host hook events where supported, so agents
# receive results instead of polling for them. Keys name the host events the
# repository's tooling understands; configure only commands the repository
# owns. Absent host support, the skills' run-once-and-wait rule is the
# fallback.
# hooks:
#   postCommit: "npm test -- --affected"

# Project rules — OPTIONAL files that let THIS repo steer specific skills without
# forking them. Each key below is a fixed rule "slot" the skills know to look for;
# point it at a markdown file of binding project guidance and the relevant skill
# reads it before acting (a project rule WINS over the skill's generic advice on
# conflict). Omit / leave null any slot you don't need — skills skip absent slots
# silently. This is how repo-specific knowledge (test layout, where code lives,
# component budget, reuse-before-build, type conventions, security policy) reaches
# the otherwise-generic skills. Which skill reads which slot is noted after each.
rules:
  code: null           # language / type / style conventions — write-code, architecture, architecture-critique, review
  testing: null        # what counts as a test, layout, lanes/fixtures, combined/integration seam — write-tests, architecture, architecture-critique, review, pipeline
  architecture: null   # architecture invariants & conventions — architecture, architecture-critique, write-code, review
  design-system: null  # component budget, tokens, reuse-before-build, promotion — design, write-code, review
  frontend: null       # client / UI conventions — design, write-code, review
  visual: null         # visual fidelity / regression policy — design, review
  aesthetics: null     # aesthetic quality bar — design
  security: null       # security policy / threat model — architecture, architecture-critique, write-code, review
  docs: null           # documentation voice & conventions — write-docs, review
  taste: null          # standing conventions for how this repo likes things done — refine, program-design, pipeline
# The `taste` slot is short, standing conventions only — the answers you have given
# often enough to be worth not repeating. It is NOT a lookup table for per-item
# questions: when an interview needs to know how you want something and this item's
# plan does not say, the agent asks you rather than stretching a convention written
# for a different question. /retro records where an agent's choice diverged from what
# you wanted, /compound proposes an amendment, and you approve it.
# Rule files live under .pipeline/rules/ — host-neutral, so every tool reads the same
# ones. They are maintainer-authored and committed: /setup writes them with your
# approval, and no pipeline run may edit them (the orchestrator owns .pipeline/work/<id>/
# and nothing else under .pipeline/).
# Example (a TS app):
#   code: .pipeline/rules/typescript.md
#   testing: .pipeline/rules/testing.md
#   design-system: .pipeline/rules/design-system.md
#   frontend: .pipeline/rules/frontend.md
#   visual: .pipeline/rules/visual-regression.md
#   aesthetics: .pipeline/rules/aesthetic-quality.md
