<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How idle-harness works, as one cycle. Tasks arrive, none of them complete. A working session closes its own loop: the agent acts on the work, builds sensors and simulations to see the result, and steers by them. It hands in; you approve and rate it. Everything is recorded: the cost to reach an approved solution and its rating, per task and per sensor version. Across many tasks, improvement keeps the best version of each sensor and makes it part of the harness. The next sessions start from that new version. Underneath, a base loop the agent cannot break keeps every version.">
  <style>
    .bg { fill: #ffffff; }
    .stage { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .feature { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .sensor { fill: #ffffff; stroke: #0969da; stroke-width: 1.6; }
    .platform { fill: #fbefff; stroke: #c297ff; stroke-width: 1.5; }
    .human { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .base { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.5; }
    .goal { fill: none; stroke: #1a7f37; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .card { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .badge { fill: #1f2328; } .badgetext { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .title { font-size: 26px; font-weight: 750; fill: #1f2328; }
    .lead { font-size: 14px; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 650; fill: #1f2328; }
    .t { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .p { font-size: 13px; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1f2328; }
    .goaltext { font-size: 12px; fill: #1a7f37; } .goalh { font-size: 13px; font-weight: 650; fill: #1a7f37; }
    .label { font-size: 12px; font-style: italic; fill: #59636e; }
    .flow { stroke: #1f2328; stroke-width: 2.2; fill: none; marker-end: url(#dark); }
    .thin { stroke: #59636e; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#grey); }
    .ctl { stroke: #0969da; stroke-width: 2; fill: none; marker-end: url(#blue); }
    .plat { stroke: #8250df; stroke-width: 2.4; fill: none; marker-end: url(#purple); }
    #dark path { fill: #1f2328; } #grey path { fill: #59636e; } #blue path { fill: #0969da; } #purple path { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .stage { fill: #161b22; stroke: #30363d; }
      .node, .sensor, .card { fill: #0d1117; }
      .node { stroke: #30363d; } .card { stroke: #6e7681; } .sensor { stroke: #4493f8; }
      .feature { fill: #0c2d6b; stroke: #388bfd; }
      .platform { fill: #2b1a4a; stroke: #a371f7; }
      .human { fill: #3b2e00; stroke: #bb8009; }
      .base { fill: #21262d; stroke: #6e7681; }
      .goal { stroke: #3fb950; } .goaltext, .goalh { fill: #3fb950; }
      .badge { fill: #e6edf3; } .badgetext { fill: #0d1117; }
      .title, .lead, .h, .t, .p, .code { fill: #e6edf3; }
      .s, .label { fill: #9198a1; }
      .flow { stroke: #e6edf3; } #dark path { fill: #e6edf3; }
      .thin { stroke: #9198a1; } #grey path { fill: #9198a1; }
      .ctl { stroke: #4493f8; } #blue path { fill: #4493f8; }
      .plat { stroke: #ab7df8; } #purple path { fill: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="770"/>

  <!-- Title and goal -->
  <text class="title" x="40" y="46">idle-harness — an agent harness that closes its own loops</text>
  <text class="lead" x="40" y="76">Open-ended work is hard to check, and no task says everything. Better models master more skills, but none can see what it is not told.</text>
  <text class="lead" x="40" y="96">So the agent builds its own sensors and simulations to see its results, and the harness keeps the best of them — getting better at its work by itself.</text>

  <!-- 1 Tasks -->
  <rect class="stage" x="40" y="124" width="160" height="268" rx="12"/>
  <circle class="badge" cx="62" cy="148" r="12"/><text class="badgetext" x="62" y="153" text-anchor="middle">1</text>
  <text class="h" x="82" y="154">Tasks</text>
  <rect class="card" x="72" y="176" width="110" height="58" rx="6"/>
  <rect class="card" x="66" y="184" width="110" height="58" rx="6"/>
  <rect class="card" x="60" y="192" width="110" height="58" rx="6"/>
  <text class="t" x="115" y="217" text-anchor="middle">a task</text>
  <text class="s" x="115" y="236" text-anchor="middle">from idle-tasks</text>
  <text class="s" x="56" y="282">real work, one task</text>
  <text class="s" x="56" y="299">after another, none</text>
  <text class="s" x="56" y="316">of them complete:</text>
  <text class="s" x="56" y="333">something is always</text>
  <text class="s" x="56" y="350">left unsaid</text>

  <!-- 2 Working session -->
  <rect class="feature" x="236" y="124" width="500" height="268" rx="12"/>
  <circle class="badge" cx="258" cy="148" r="12"/><text class="badgetext" x="258" y="153" text-anchor="middle">2</text>
  <text class="h" x="278" y="154">A working session closes its own loop</text>

  <rect class="node" x="262" y="178" width="160" height="58" rx="8"/>
  <text class="t" x="342" y="202" text-anchor="middle">the agent's turn</text>
  <text class="s" x="342" y="222" text-anchor="middle">the LLM, steering</text>
  <rect class="node" x="556" y="178" width="160" height="58" rx="8"/>
  <text class="t" x="636" y="202" text-anchor="middle">the work</text>
  <text class="s" x="636" y="222" text-anchor="middle">code · service · data</text>
  <rect class="sensor" x="400" y="278" width="180" height="58" rx="8"/>
  <text class="t" x="490" y="302" text-anchor="middle">sensors · simulations</text>
  <text class="s" x="490" y="322" text-anchor="middle">checks, probes, fakes</text>

  <path class="ctl" d="M422,207 L554,207"/><text class="label" x="488" y="199" text-anchor="middle">acts</text>
  <path class="ctl" d="M636,236 C636,272 612,300 582,306"/><text class="label" x="652" y="282">measured</text>
  <path class="ctl" d="M398,306 C366,300 342,272 342,238"/><text class="label" x="330" y="290" text-anchor="end">shows the result</text>

  <text class="s" x="262" y="364">Uses the harness's tools and builds new ones where it cannot see;</text>
  <text class="s" x="262" y="381">a simulation where it may not try things for real. Ends with a retrospective.</text>

  <!-- 3 Review -->
  <rect class="human" x="790" y="124" width="170" height="268" rx="12"/>
  <circle class="badge" cx="814" cy="148" r="12"/><text class="badgetext" x="814" y="153" text-anchor="middle">3</text>
  <text class="h" x="834" y="154">You review</text>
  <text class="p" x="810" y="190">approve the solution</text>
  <text class="p" x="810" y="210">and rate it 1–5</text>
  <text class="s" x="810" y="240">in the chat, on the</text>
  <text class="s" x="810" y="257">command line or on</text>
  <text class="s" x="810" y="274">a pull request</text>
  <text class="s" x="810" y="304">nothing waits for you;</text>
  <text class="s" x="810" y="321">the agent moves on</text>

  <!-- What counts -->
  <rect class="goal" x="990" y="124" width="170" height="268" rx="12"/>
  <text class="goalh" x="1006" y="154">What counts</text>
  <text class="goaltext" x="1006" y="186">efficiency:</text>
  <text class="goaltext" x="1006" y="203">the cost to reach a</text>
  <text class="goaltext" x="1006" y="220">solution you approve</text>
  <text class="goaltext" x="1006" y="252">quality:</text>
  <text class="goaltext" x="1006" y="269">your rating of it</text>
  <text class="goaltext" x="1006" y="301">measured on real</text>
  <text class="goaltext" x="1006" y="318">work over many tasks,</text>
  <text class="goaltext" x="1006" y="335">never a benchmark</text>

  <!-- top row flow -->
  <path class="flow" d="M200,258 L234,258"/>
  <path class="flow" d="M736,258 L788,258"/><text class="label" x="763" y="248" text-anchor="middle">hands in</text>

  <!-- 4 Record -->
  <rect class="stage" x="880" y="440" width="280" height="200" rx="12"/>
  <circle class="badge" cx="902" cy="464" r="12"/><text class="badgetext" x="902" y="469" text-anchor="middle">4</text>
  <text class="h" x="922" y="470">Everything is recorded</text>
  <text class="s" x="898" y="498">every turn, tool call, cost and token;</text>
  <text class="s" x="898" y="515">approval, rating and retrospective</text>
  <text class="s" x="898" y="532">in idle-tasks</text>
  <rect class="node" x="898" y="550" width="244" height="74" rx="8"/>
  <text class="t" x="910" y="572">the cost to an approved solution</text>
  <text class="t" x="910" y="590">and its rating, per task and per</text>
  <text class="t" x="910" y="608">version of every sensor</text>
  <path class="flow" d="M920,392 L920,438"/><text class="label" x="930" y="420">approval, rating</text>
  <path class="thin" d="M700,392 C720,422 810,432 878,472"/><text class="label" x="752" y="456">every turn</text>

  <!-- 5 Improvement -->
  <rect class="platform" x="460" y="440" width="360" height="200" rx="12"/>
  <circle class="badge" cx="482" cy="464" r="12"/><text class="badgetext" x="482" y="469" text-anchor="middle">5</text>
  <text class="h" x="502" y="470">Improvement, across many tasks</text>
  <text class="p" x="480" y="500">Sessions each built their own version of a sensor.</text>
  <text class="p" x="480" y="522">It keeps the one that did the job best, for least,</text>
  <text class="p" x="480" y="544">makes it part of the harness — tested, and run by</text>
  <text class="p" x="480" y="566">the turn without being asked — and removes what</text>
  <text class="p" x="480" y="588">never fired.</text>
  <text class="s" x="480" y="618">its own session · small steps that say what they are for</text>
  <path class="flow" d="M878,540 L822,540"/><text class="label" x="850" y="530" text-anchor="middle">evidence</text>

  <!-- 6 The harness -->
  <rect class="base" x="40" y="440" width="360" height="200" rx="12"/>
  <circle class="badge" cx="62" cy="464" r="12"/><text class="badgetext" x="62" y="469" text-anchor="middle">6</text>
  <text class="h" x="82" y="470">The harness, a new version</text>
  <text class="p" x="60" y="500">a folder the agent owns and may change</text>
  <text class="p" x="60" y="520">entirely:</text>
  <rect class="node" x="60" y="532" width="320" height="38" rx="8"/>
  <text class="code" x="76" y="556">turn.ts · tools/*.ts · notes · settings</text>
  <text class="s" x="60" y="594">turn.ts decides how each turn runs; tools/ are its own</text>
  <text class="s" x="60" y="611">tools; v1 → v2 → v3, every change kept in git</text>
  <path class="plat" d="M458,540 L402,540"/><text class="label" x="430" y="530" text-anchor="middle">writes</text>
  <path class="plat" d="M300,438 L300,394"/><text class="label" x="310" y="422">the next sessions start from it</text>

  <!-- The base -->
  <rect class="base" x="40" y="664" width="1120" height="76" rx="12"/>
  <text class="h" x="60" y="692">Underneath: the base, a loop the agent cannot break</text>
  <text class="s" x="60" y="716">It runs every turn and loads the harness again each time. If the agent's own code fails, a plain turn takes over. Every version of the harness is</text>
  <text class="s" x="60" y="732">kept, so the agent can always go back; records are never lost, even when the agent's context is compacted.</text>
</svg>
