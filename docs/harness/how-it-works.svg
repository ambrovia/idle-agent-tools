<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="idle-harness: working sessions build sensors and simulations to see the result of their work; you approve and rate; everything is recorded; improvement keeps the sensors that did best for least and writes them into the harness the next sessions run on.">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .feature { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .platform { fill: #fbefff; stroke: #c297ff; stroke-width: 1.5; }
    .human { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .base { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .badge { fill: #1f2328; }
    .badgetext { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .title { font-size: 22px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .h { font-size: 16px; font-weight: 650; fill: #1f2328; }
    .t { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-style: italic; fill: #59636e; }
    .arrow { stroke: #59636e; stroke-width: 1.6; fill: none; marker-end: url(#grey); }
    .ctl { stroke: #0969da; stroke-width: 2; fill: none; marker-end: url(#blue); }
    .plat { stroke: #8250df; stroke-width: 2; fill: none; marker-end: url(#purple); }
    #grey path { fill: #59636e; } #blue path { fill: #0969da; } #purple path { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .feature { fill: #0c2d6b; stroke: #388bfd; }
      .platform { fill: #2b1a4a; stroke: #a371f7; }
      .human { fill: #3b2e00; stroke: #bb8009; }
      .base { fill: #21262d; stroke: #6e7681; }
      .node { fill: #0d1117; stroke: #30363d; }
      .badge { fill: #e6edf3; } .badgetext { fill: #0d1117; }
      .title, .h, .t { fill: #e6edf3; } .sub, .s, .label { fill: #9198a1; }
      .arrow { stroke: #9198a1; } #grey path { fill: #9198a1; }
      .ctl { stroke: #4493f8; } #blue path { fill: #4493f8; }
      .plat { stroke: #ab7df8; } #purple path { fill: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="680"/>

  <text class="title" x="40" y="44">idle-harness — a harness that closes its own loops</text>
  <text class="sub" x="40" y="70">Work is hard to check when information is missing. Sessions build what lets them see the result; improvement keeps what pays.</text>

  <!-- 1 The feature loop -->
  <rect class="feature" x="40" y="96" width="430" height="336" rx="12"/>
  <circle class="badge" cx="66" cy="124" r="12"/><text class="badgetext" x="66" y="129" text-anchor="middle">1</text>
  <text class="h" x="88" y="130">A working session does a task</text>
  <text class="s" x="88" y="150">the feature loop · minutes to hours</text>

  <rect class="node" x="60" y="176" width="150" height="56" rx="8"/>
  <text class="t" x="135" y="200" text-anchor="middle">the LLM turn</text>
  <text class="s" x="135" y="219" text-anchor="middle">the controller</text>

  <rect class="node" x="300" y="176" width="150" height="56" rx="8"/>
  <text class="t" x="375" y="200" text-anchor="middle">sensors, simulations</text>
  <text class="s" x="375" y="219" text-anchor="middle">checks · probes · fakes</text>

  <rect class="node" x="180" y="296" width="150" height="56" rx="8"/>
  <text class="t" x="255" y="320" text-anchor="middle">the work</text>
  <text class="s" x="255" y="339" text-anchor="middle">project · service · world</text>

  <path class="ctl" d="M135,232 C135,268 156,300 178,316"/>
  <text class="label" x="118" y="284" text-anchor="end">acts on</text>
  <path class="ctl" d="M332,316 C356,300 375,268 375,234"/>
  <text class="label" x="386" y="284">measures</text>
  <path class="ctl" d="M298,204 L212,204"/>
  <text class="label" x="255" y="196" text-anchor="middle">the result</text>

  <text class="s" x="60" y="384">Where it cannot try things on the real thing, it builds a</text>
  <text class="s" x="60" y="402">simulation and keeps checking it against reality. It ends</text>
  <text class="s" x="60" y="420">with a retrospective and asks for review — then moves on.</text>

  <!-- 2 Review by the human -->
  <rect class="human" x="530" y="96" width="430" height="84" rx="12"/>
  <circle class="badge" cx="556" cy="124" r="12"/><text class="badgetext" x="556" y="129" text-anchor="middle">2</text>
  <text class="h" x="578" y="130">You approve the solution and rate it 1–5</text>
  <text class="s" x="578" y="152">in the chat, on the command line or on a pull request</text>
  <text class="s" x="578" y="170">nothing waits for it</text>
  <path class="arrow" d="M470,136 L528,136"/>
  <text class="label" x="499" y="126" text-anchor="middle">review</text>

  <!-- 3 The record -->
  <rect class="card" x="530" y="208" width="430" height="100" rx="12"/>
  <circle class="badge" cx="556" cy="236" r="12"/><text class="badgetext" x="556" y="241" text-anchor="middle">3</text>
  <text class="h" x="578" y="242">Everything is recorded</text>
  <text class="s" x="578" y="266">session records — every turn, call, cost and token</text>
  <text class="s" x="578" y="286">idle-tasks — the task, its approval, rating and retrospective</text>
  <path class="arrow" d="M470,258 L528,258"/>
  <text class="label" x="499" y="248" text-anchor="middle">records</text>
  <path class="arrow" d="M745,180 L745,206"/>

  <!-- 4 The platform loop -->
  <rect class="platform" x="530" y="336" width="430" height="176" rx="12"/>
  <circle class="badge" cx="556" cy="364" r="12"/><text class="badgetext" x="556" y="369" text-anchor="middle">4</text>
  <text class="h" x="578" y="370">Improvement, across many tasks</text>
  <text class="s" x="578" y="390">the platform loop · its own session, small steps</text>
  <path class="arrow" d="M745,308 L745,334"/>

  <rect class="node" x="550" y="404" width="390" height="44" rx="8"/>
  <text class="t" x="566" y="423">measures every task and every sensor version</text>
  <text class="s" x="566" y="440">cost to reach an approved solution · its rating</text>
  <rect class="node" x="550" y="458" width="390" height="44" rx="8"/>
  <text class="t" x="566" y="477">keeps the version that did best for least</text>
  <text class="s" x="566" y="494">gives it checks, wires it into the turn, prunes what never fires</text>

  <!-- 5 The harness on the base -->
  <rect class="base" x="40" y="548" width="920" height="112" rx="12"/>
  <circle class="badge" cx="66" cy="576" r="12"/><text class="badgetext" x="66" y="581" text-anchor="middle">5</text>
  <text class="h" x="88" y="582">The harness — a folder the base keeps every version of</text>
  <rect class="node" x="60" y="596" width="430" height="48" rx="8"/>
  <text class="t" x="76" y="616">turn.ts · tools/ · notes · settings</text>
  <text class="s" x="76" y="634">anything may change; loaded again every turn</text>
  <rect class="node" x="510" y="596" width="430" height="48" rx="8"/>
  <text class="t" x="526" y="616">a base loop the harness cannot break</text>
  <text class="s" x="526" y="634">versions in git — it can always see its earlier selves and go back</text>

  <path class="plat" d="M745,512 L745,546"/>
  <text class="label" x="755" y="534">writes a new version</text>
  <path class="arrow" d="M255,546 L255,434"/>
  <text class="label" x="265" y="494">the next sessions run on it</text>
</svg>
